<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* Always white outer box, black inner icon */
    .bg { fill: #FFFFFF; }
    .logo-sq { fill: #111111; }
  </style>

  <!-- Background with smooth rounded corners: Always White -->
  <rect class="bg" width="32" height="32" rx="7.5" />
  
  <!-- Skin Story Two-Square Logo Mark: Always Black -->
  <g transform="translate(6, 6)">
    <!-- Top-Right Larger Square -->
    <rect class="logo-sq" x="7.5" y="0" width="12.5" height="12.5" rx="1.5" />
    <!-- Bottom-Left Smaller Square -->
    <rect class="logo-sq" x="0" y="12.5" width="7.5" height="7.5" rx="1" />
  </g>
</svg>
